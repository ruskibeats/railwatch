# Run the root-owned runtime copy as root.
#
# Why: the notify route needs an SSH hop to caddy and the config lives at
# /etc/uclh-rail/config.json (root 600). The service user must be root, and it
# must not run from the agent-writable checkout. Upgrade = re-run install.sh,
# which re-copies main to /opt/uclh/railwatch and reinstalls this drop-in.
[Service]
User=root
Group=root
ExecStart=
ExecStart=/usr/bin/node /opt/uclh/railwatch/rail/run.mjs